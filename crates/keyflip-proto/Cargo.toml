[package]
name = "keyflip-proto"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# `engine` pulls in the whole engine and lexicon (several MB). Only the server
# needs it; shells that merely speak the protocol use default-features = false.
default = ["engine"]
engine = ["dep:keyflip-core"]

[dependencies]
keyflip-core = { path = "../keyflip-core", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
